name: Instrumented Tests (Emulator)

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  emulator:
    name: اختبارات حقيقية على محاكي أندرويد (بدون خدمات جوجل)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RUNNER: com.borhji.mushaf.debug.test/androidx.test.runner.AndroidJUnitRunner

    steps:
      - name: تنزيل الشيفرة
        uses: actions/checkout@v4

      - name: تهيئة Java 17
        continue-on-error: true
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: تهيئة Gradle (تخزين مؤقت)
        continue-on-error: true
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      # ---------- نقطة تفتيش 1: تجهيز صورة النظام وإنشاء الجهاز ----------
      - name: تجهيز صورة النظام وإنشاء الجهاز الافتراضي
        timeout-minutes: 30
        run: |
          set -x
          : > /tmp/inst.log
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x ./gradlew
          log() { echo "$@" | tee -a /tmp/inst.log; }

          log "kvm قبل الإصلاح: $(ls -l /dev/kvm 2>&1)"
          log "المستخدم: $(id)"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null || true
          sudo udevadm control --reload-rules > /dev/null 2>&1 || true
          sudo udevadm trigger --name-match=kvm > /dev/null 2>&1 || true
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          sudo usermod -aG kvm "$(id -un)" > /dev/null 2>&1 || true
          log "kvm بعد الإصلاح: $(ls -l /dev/kvm 2>&1)"
          log "=== محتوى مكتبة SDK ==="
          ls "$ANDROID_HOME" 2>&1 | tee -a /tmp/inst.log || true

          log "=== البحث عن أدوات سطر الأوامر ==="
          SDKM=""
          for cand in "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" "$ANDROID_HOME/tools/bin/sdkmanager"; do
            if [ -n "$cand" ] && [ -x "$cand" ]; then SDKM="$cand"; break; fi
          done
          log "SDKM=$SDKM"
          if [ -z "$SDKM" ]; then
            log "لم تُوجد أدوات سطر الأوامر — تنزيلها من مستودع أندرويد"
            TIMEOUT_CMD=""
            command -v timeout > /dev/null 2>&1 && TIMEOUT_CMD="timeout 600"
            $TIMEOUT_CMD curl -sSL -o /tmp/cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip || true
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            command -v unzip > /dev/null 2>&1 && unzip -q -o /tmp/cmdline.zip -d /tmp/cmdline-tools || true
            rm -rf "$ANDROID_HOME/cmdline-tools/latest"
            mv /tmp/cmdline-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest" 2>/dev/null || true
            [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ] && SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            log "SDKM=$SDKM"
          fi
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          if [ -n "$SDKM" ]; then
            echo "$(dirname "$SDKM")" >> "$GITHUB_PATH"
            export PATH="$(dirname "$SDKM"):$PATH"
          fi
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          command -v avdmanager | tee -a /tmp/inst.log || true

          log "=== الصور المثبتة مسبقًا ==="
          INSTALLED=""
          if [ -n "$SDKM" ]; then
            timeout 300 "$SDKM" --sdk_root="$ANDROID_HOME" --licenses < /dev/null > /dev/null 2>&1 || true
            INSTALLED=$(timeout 300 "$SDKM" --sdk_root="$ANDROID_HOME" --list_installed 2>/dev/null | tr -d '\r' || true)
            echo "$INSTALLED" | head -40 | tee -a /tmp/inst.log || true
          fi

          pick_image() {
            local best="" bestscore=-1 img api tag score
            while read -r img; do
              [ -z "$img" ] && continue
              api=$(echo "$img" | cut -d';' -f2 | tr -dc '0-9')
              tag=$(echo "$img" | cut -d';' -f3)
              [ -z "$api" ] && continue
              [ "$api" -lt 29 ] && continue
              score=$(( api * 100 ))
              case "$tag" in
                aosp_atd) score=$((score+40));;
                google_atd) score=$((score+30));;
                default) score=$((score+20));;
                google_apis) score=$((score+10));;
                *) score=$((score+5));;
              esac
              if [ "$score" -gt "$bestscore" ]; then bestscore=$score; best="$img"; fi
            done <<< "$(echo "$1" | grep -oE 'system-images;android-[0-9]+;[a-z_]+;x86_64' | sort -u)"
            echo "$best"
          }

          SDK_IMG=$(pick_image "$INSTALLED")
          log "صورة مثبتة مسبقًا: $SDK_IMG"

          if [ -z "$SDK_IMG" ] && [ -n "$SDKM" ]; then
            log "=== تنزيل صورة نظام ==="
            for tag in aosp_atd google_atd default google_apis; do
              for api in 34 33 35; do
                CAND="system-images;android-$api;$tag;x86_64"
                log "محاولة: $CAND"
                if timeout 900 bash -c "yes | '$SDKM' --sdk_root='$ANDROID_HOME' '$CAND' > /tmp/sdk-img.log 2>&1" \
                   && [ -d "$ANDROID_HOME/system-images/android-$api/$tag/x86_64" ]; then
                  SDK_IMG="$CAND"; log "تم تثبيت: $SDK_IMG"; break 2
                fi
                tail -3 /tmp/sdk-img.log 2>/dev/null | tee -a /tmp/inst.log || true
              done
            done
          fi

          if [ -z "$SDK_IMG" ]; then
            log "تعذّر توفير صورة نظام"
            { echo "## (تفتيش 1) تعذّر توفير صورة نظام للمحاكي — الجلسة ${{ github.run_number }}"; echo '```'; tail -70 /tmp/inst.log; echo '```'; } > /tmp/c1.md
            jq -n --arg body "$(cat /tmp/c1.md)" '{body:$body}' > /tmp/c1.json
            gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" --input /tmp/c1.json || true
            exit 1
          fi
          echo "SDK_IMG=$SDK_IMG" >> "$GITHUB_ENV"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_AVD_HOME"

          log "=== إنشاء الجهاز الافتراضي ==="
          AVDM="$(command -v avdmanager 2>/dev/null || true)"
          [ -z "$AVDM" ] && [ -n "$SDKM" ] && [ -x "$(dirname "$SDKM")/avdmanager" ] && AVDM="$(dirname "$SDKM")/avdmanager"
          log "AVDM=$AVDM"
          if [ -n "$AVDM" ]; then
            echo no | timeout 180 "$AVDM" create avd -n mushaf34 -k "$SDK_IMG" -d pixel_5 --force 2>&1 | tee -a /tmp/inst.log || true
          fi
          if [ ! -f "$ANDROID_AVD_HOME/mushaf34.ini" ] && [ -n "$AVDM" ]; then
            log "إعادة المحاولة بدون تحديد الجهاز"
            echo no | timeout 180 "$AVDM" create avd -n mushaf34 -k "$SDK_IMG" --force 2>&1 | tee -a /tmp/inst.log || true
          fi
          if [ ! -f "$ANDROID_AVD_HOME/mushaf34.ini" ]; then
            log "=== إنشاء الجهاز يدويًا (بدون avdmanager) ==="
            IMG_DIR=$(echo "$SDK_IMG" | sed 's/;system-images;/system-images;/' | awk -F';' '{print $2"/"$3"/"$4}')
            TAG_ID=$(echo "$SDK_IMG" | awk -F';' '{print $3}')
            API_NUM=$(echo "$SDK_IMG" | awk -F';' '{print $2}' | tr -dc '0-9')
            mkdir -p "$ANDROID_AVD_HOME/mushaf34.avd"
            {
              echo "AvdId=mushaf34"
              echo "avd.ini.displayname=mushaf34"
              echo "image.sysdir.1=$IMG_DIR/"
              echo "tag.id=$TAG_ID"
              echo "tag.display=Android"
              echo "abi.type=x86_64"
              echo "hw.cpu.arch=x86_64"
              echo "hw.cpu.ncore=2"
              echo "hw.ramSize=2048"
              echo "vm.heapSize=256"
              echo "hw.lcd.density=420"
              echo "hw.lcd.height=1920"
              echo "hw.lcd.width=1080"
              echo "disk.dataPartition.size=4096M"
              echo "hw.gpu.enabled=yes"
              echo "hw.gpu.mode=swiftshader_indirect"
              echo "hw.keyboard=yes"
              echo "hw.audioInput=no"
              echo "hw.audioOutput=no"
              echo "hw.camera.back=none"
              echo "hw.camera.front=none"
              echo "hw.sdCard=no"
              echo "skin.dynamic=yes"
            } > "$ANDROID_AVD_HOME/mushaf34.avd/config.ini"
            {
              echo "avd.ini.encoding=UTF-8"
              echo "path=$ANDROID_AVD_HOME/mushaf34.avd"
              echo "path.rel=avd/mushaf34.avd"
              echo "target=android-$API_NUM"
            } > "$ANDROID_AVD_HOME/mushaf34.ini"
          fi
          ls -l "$ANDROID_AVD_HOME" 2>&1 | tee -a /tmp/inst.log || true
          cat "$ANDROID_AVD_HOME/mushaf34.ini" 2>&1 | tee -a /tmp/inst.log || true
          if [ ! -f "$ANDROID_AVD_HOME/mushaf34.ini" ]; then
            log "تعذّر إنشاء الجهاز الافتراضي"
            { echo "## (تفتيش 1) تعذّر إنشاء الجهاز الافتراضي — الجلسة ${{ github.run_number }}"; echo '```'; tail -80 /tmp/inst.log; echo '```'; } > /tmp/c1b.md
            jq -n --arg body "$(cat /tmp/c1b.md)" '{body:$body}' > /tmp/c1b.json
            gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" --input /tmp/c1b.json || true
            exit 1
          fi
          if [ -n "$AVDM" ]; then timeout 90 "$AVDM" list avd 2>&1 | head -14 | tee -a /tmp/inst.log || true; fi
          cp /tmp/inst.log /tmp/setup.log
          ls -l "$ANDROID_HOME/emulator/emulator" 2>&1 | tee -a /tmp/inst.log || true
          if [ -n "$SDKM" ] && [ ! -x "$ANDROID_HOME/emulator/emulator" ]; then
            log "=== تثبيت حزمة المحاكي ==="
            timeout 900 bash -c "yes | '$SDKM' --sdk_root='$ANDROID_HOME' 'emulator' > /tmp/sdk-emu.log 2>&1" || true
            tail -5 /tmp/sdk-emu.log 2>/dev/null | tee -a /tmp/inst.log || true
            ls -l "$ANDROID_HOME/emulator/emulator" 2>&1 | tee -a /tmp/inst.log || true
          fi

      # ---------- نقطة تفتيش 2: تشغيل المحاكي ----------
      - name: تشغيل المحاكي (بمهلة محدودة)
        timeout-minutes: 20
        run: |
          set -o pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          log() { echo "$@" | tee -a /tmp/inst.log; }
          EMU_BIN=""
          for cand in "$ANDROID_HOME/emulator/emulator" /usr/local/lib/android/sdk/emulator/emulator "$(command -v emulator 2>/dev/null || true)"; do
            if [ -n "$cand" ] && [ -x "$cand" ]; then EMU_BIN="$cand"; break; fi
          done
          log "EMU_BIN=$EMU_BIN"
          if [ -z "$EMU_BIN" ]; then
            log "لم يُعثر على برنامج المحاكي — تنزيله الآن"
            timeout 900 bash -c "yes | sdkmanager --sdk_root='$ANDROID_HOME' 'emulator' > /tmp/sdk-emu.log 2>&1" || true
            EMU_BIN="$ANDROID_HOME/emulator/emulator"
          fi
          ls -l "$EMU_BIN" 2>&1 | tee -a /tmp/inst.log || true
          timeout 120 "$EMU_BIN" -accel-check 2>&1 | tee -a /tmp/inst.log || log "تحذير: -accel-check لم ينجح"
          log "=== الأجهزة الافتراضية المتاحة ==="
          timeout 60 "$EMU_BIN" -list-avds 2>&1 | tee -a /tmp/inst.log || true
          log "=== تشغيل المحاكي: $EMU_BIN ==="
          nohup "$EMU_BIN" -avd mushaf34 -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -no-audio \
            -camera-back none -camera-front none -netdelay none -netspeed full > /tmp/emulator.log 2>&1 &
          adb start-server > /dev/null 2>&1 || true
          timeout 90 adb wait-for-device || log "تحذير: adb wait-for-device انتهى بمهلة"
          BOOTED=0
          for i in $(seq 1 60); do
            B=$(timeout 20 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$B" = "1" ]; then BOOTED=1; break; fi
            if ! pgrep -f "qemu-system" > /dev/null 2>&1; then log "توقّف المحاكي في الدورة $i"; break; fi
            sleep 5
          done
          log "BOOT_COMPLETED=$BOOTED بعد $((i*5)) ثانية"
          timeout 30 adb shell input keyevent 82 || true
          sleep 15
          log "أجهزة adb المتصلة:"; adb devices | tee -a /tmp/inst.log
          if [ "$BOOTED" = "1" ]; then
            timeout 30 adb shell getprop ro.build.version.sdk | tee -a /tmp/inst.log || true
          else
            { echo "## (تفتيش 2) لم يُكمل المحاكي الإقلاع — الجلسة ${{ github.run_number }}"; echo '```'; tail -40 /tmp/emulator.log 2>/dev/null; echo '```'; echo "### سجل"; echo '```'; tail -30 /tmp/inst.log; echo '```'; } > /tmp/c2.md
            jq -n --arg body "$(cat /tmp/c2.md)" '{body:$body}' > /tmp/c2.json
            gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" --input /tmp/c2.json || true
            exit 1
          fi

      # ---------- نقطة تفتيش 3: بناء التطبيق وتثبيته ----------
      - name: بناء التطبيق وملف الاختبار وتثبيتهما
        timeout-minutes: 35
        run: |
          set -o pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          log() { echo "$@" | tee -a /tmp/inst.log; }
          log "=== البناء ==="
          timeout 1500 ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest 2>&1 | tee -a /tmp/inst.log | tail -30
          log "BUILD_EXIT=${PIPESTATUS[0]}"
          log "=== التثبيت ==="
          timeout 180 adb install -r -t app/build/outputs/apk/debug/app-debug.apk 2>&1 | tee -a /tmp/inst.log || true
          timeout 180 adb install -r -t app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk 2>&1 | tee -a /tmp/inst.log || true
          timeout 60 adb shell pm clear com.borhji.mushaf.debug 2>&1 | tee -a /tmp/inst.log || true
          log "=== وضع الطيران ==="
          timeout 30 adb shell svc wifi disable || true
          timeout 30 adb shell svc data disable || true
          timeout 30 adb shell settings put global airplane_mode_on 1 || true
          timeout 30 adb shell am broadcast -a android.intent.action.AIRPLANE_MODE --ez state true || true
          { echo "## (تفتيش 3) تم البناء والتثبيت — الجلسة ${{ github.run_number }}"; echo '```'; grep -E "BUILD_EXIT|Success|Failure|Installed|installed" /tmp/inst.log | tail -20; echo '```'; } > /tmp/c3.md
          jq -n --arg body "$(cat /tmp/c3.md)" '{body:$body}' > /tmp/c3.json
          gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" --input /tmp/c3.json || true

      # ---------- المرحلة 1 ----------
      - name: المرحلة 1 — الاستيراد والتشغيل والخلفية والواجهة
        timeout-minutes: 40
        run: |
          set -o pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          log() { echo "$@" | tee -a /tmp/inst.log; }
          log "=== المرحلة 1: LibraryImportTest + PlaybackTest + UiSmokeTest ==="
          timeout 1800 adb shell am instrument -w -r \
            -e class com.borhji.mushaf.LibraryImportTest,com.borhji.mushaf.PlaybackTest,com.borhji.mushaf.UiSmokeTest \
            "$RUNNER" > /tmp/phase1.log 2>&1
          echo "PHASE1_EXIT=$?" | tee -a /tmp/inst.log
          cat /tmp/phase1.log >> /tmp/inst.log
          if grep -qE "FAILURES!!!|Process crashed|INSTRUMENTATION_FAILED|INSTRUMENTATION_CODE: -1|shortMsg=" /tmp/phase1.log; then
            echo "PHASE1_VERDICT=failed" | tee -a /tmp/inst.log
          else
            echo "PHASE1_VERDICT=passed" | tee -a /tmp/inst.log
          fi
          { echo "## (تفتيش 4) نتيجة المرحلة 1 — الجلسة ${{ github.run_number }}"; echo '```'; grep -E "^(OK|FAILURES|Tests run|Time:|INSTRUMENTATION|PHASE1_EXIT)" /tmp/inst.log | tail -20; echo '```'; echo "### الفشل"; echo '```'; grep -E "junit|AssertionError|Exception|Error" /tmp/phase1.log | head -40; echo '```'; } > /tmp/c4.md
          jq -n --arg body "$(cat /tmp/c4.md)" '{body:$body}' > /tmp/c4.json
          gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" --input /tmp/c4.json || true

      # ---------- إعادة تشغيل الجهاز ----------
      - name: إعادة تشغيل الجهاز
        timeout-minutes: 20
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          log() { echo "$@" | tee -a /tmp/inst.log; }
          log "=== إعادة التشغيل ==="
          timeout 60 adb reboot || true
          timeout 120 adb wait-for-device || log "تحذير: انتظار الإقلاع بمهلة"
          for i in $(seq 1 60); do
            B=$(timeout 20 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$B" = "1" ]; then break; fi
            sleep 10
          done
          timeout 30 adb shell input keyevent 82 || true
          sleep 20
          log "REBOOT_BOOT_COMPLETED=$(timeout 20 adb shell getprop sys.boot_completed | tr -d '\r') بعد $((i*10)) ثانية"

      # ---------- المرحلة 2 ----------
      - name: المرحلة 2 — بقاء الملفات والموضع بعد إعادة التشغيل
        timeout-minutes: 30
        run: |
          set -o pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          log() { echo "$@" | tee -a /tmp/inst.log; }
          log "=== المرحلة 2: RebootPersistenceTest ==="
          timeout 1200 adb shell am instrument -w -r \
            -e class com.borhji.mushaf.RebootPersistenceTest \
            "$RUNNER" > /tmp/phase2.log 2>&1
          echo "PHASE2_EXIT=$?" | tee -a /tmp/inst.log
          cat /tmp/phase2.log >> /tmp/inst.log
          if grep -qE "FAILURES!!!|Process crashed|INSTRUMENTATION_FAILED|INSTRUMENTATION_CODE: -1|shortMsg=" /tmp/phase2.log; then
            echo "PHASE2_VERDICT=failed" | tee -a /tmp/inst.log
          else
            echo "PHASE2_VERDICT=passed" | tee -a /tmp/inst.log
          fi
          timeout 40 adb shell dumpsys activity services com.borhji.mushaf.debug 2>&1 | head -20 | tee -a /tmp/inst.log || true

      # ---------- حكم نهائي على الاختبارات ----------
      - name: التحقق من نتيجة الاختبارات
        if: always()
        run: |
          verdict=0
          grep -q "PHASE1_VERDICT=passed" /tmp/inst.log 2>/dev/null || { echo "المرحلة 1 لم تكتمل أو فشلت"; verdict=1; }
          grep -q "PHASE2_VERDICT=passed" /tmp/inst.log 2>/dev/null || { echo "المرحلة 2 لم تكتمل أو فشلت"; verdict=1; }
          echo "VERDICT=$verdict" | tee -a /tmp/inst.log
          exit $verdict

      # ---------- التقرير النهائي ----------
      - name: نشر التقرير النهائي (تعليق على الكوميت)
        if: always()
        continue-on-error: true
        run: |
          {
            echo "## تقرير الاختبارات الحقيقية على المحاكي — الجلسة ${{ github.run_number }}"
            echo ""
            echo "* الفرع: \`${{ github.ref_name }}\`"
            echo "* الكوميت: \`${{ github.sha }}\`"
            echo "* النتيجة الكلية للمهمة: \`${{ job.status }}\`"
            echo ""
            echo "### ملخص النتائج"
            echo '```'
            grep -E "^(OK|FAILURES|Tests run|Time:|PHASE|BOOT|REBOOT|BUILD_EXIT|SDK_IMG|VERDICT|INSTRUMENTATION_CODE|INSTRUMENTATION_FAILED)" /tmp/inst.log 2>/dev/null | tail -40 || echo "لا يوجد ملخص"
            echo '```'
            echo "### الاختبارات الفاشلة"
            echo '```'
            awk '/INSTRUMENTATION_STATUS: test=/{t=$0} /INSTRUMENTATION_STATUS_CODE: -/{print t"  ==>  "$0}' /tmp/phase1.log /tmp/phase2.log 2>/dev/null | sed 's/INSTRUMENTATION_STATUS: //g' | head -30 || true
            echo '```'
            echo "### حالات الفشل"
            echo '```'
            grep -E "(junit\.framework|java\.lang\.AssertionError|Exception|Error|Caused by)" /tmp/inst.log 2>/dev/null | head -50 || true
            echo '```'
            echo "### سجل التجهيز (مقتطف)"
            echo '```'
            grep -E "kvm|SDKM=|AVDM=|AVD|avdmanager|SDK_IMG|EMU_BIN|EMU|محاولة|تم تثبيت|تعذّر|BOOT|استخدم|قائمة" /tmp/setup.log 2>/dev/null | tail -60 || echo "لا سجل تجهيز"
            echo '```'
            echo "### سجل المرحلة 1 (آخر 120 سطرًا)"
            echo '```'
            tail -120 /tmp/phase1.log 2>/dev/null || echo "لا سجل"
            echo '```'
            echo "### سجل المرحلة 2 (آخر 80 سطرًا)"
            echo '```'
            tail -80 /tmp/phase2.log 2>/dev/null || echo "لا سجل"
            echo '```'
            echo "### سجل المحاكي (آخر 30 سطرًا)"
            echo '```'
            tail -30 /tmp/emulator.log 2>/dev/null || echo "لا سجل محاكي"
            echo '```'
          } > /tmp/report-inst.md
          jq -n --arg body "$(cat /tmp/report-inst.md)" '{body:$body}' > /tmp/report-inst.json
          gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" --input /tmp/report-inst.json
